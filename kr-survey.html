<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>피부 타입 테스트 — 서울 스킨 아뜰리에</title>
<meta name="description" content="7문항, 60초. 지금 내 피부에 꼭 필요한 성분과 제품을 찾아줘요. 로그인 없이 무료.">
<meta property="og:title" content="나에게 맞는 스킨제품 찾기 — 1분 피부 타입 테스트">
<meta property="og:description" content="꼭 필요한 제품만 남기는 화장대 다이어트. 무료 · 로그인 없음.">
<meta property="og:type" content="website">

<!-- 공유: 카카오 SDK (TODO(하이롱): developers 앱 등록 후 아래 KAKAO_JS_KEY 입력) + 카드 저장: html2canvas -->
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<!-- 제품 마스터(하이롱 편집용) — 이 파일만 고치면 제품 정보가 바뀝니다 -->
<script src="kr-products.js"></script>
<style>
:root{
  --cream:#F5EFE3; --card:#FDFAF3; --line:#E7DCC8;
  --gold:#B98A44; --gold-soft:#C9A15E; --brown:#6B5638; --soft:#A2917A;
  --dark:#2A2118; --ink:#3A2E20;
  --pink-bg:#F5DFD6; --pink-tx:#B4553F;
  --green:#7E9B6E; --red:#C05B4A; --blue:#7A93A8;
  --oy:#9BCE26;
  --coupang:#C81E29;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  --serif:'Noto Serif KR',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.6;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
a{color:inherit;text-decoration:none;}
.hidden{display:none !important;}
.page{max-width:480px;margin:0 auto;padding:0 22px 80px;}

/* ══════════ 설문 ══════════ */
.sv-top{display:flex;align-items:center;gap:12px;padding-top:32px;}
.sv-qno{font-size:14px;font-weight:900;color:var(--ink);flex-shrink:0;}
.sv-bar{flex:1;height:7px;border-radius:999px;background:#E9E1D0;overflow:hidden;}
.sv-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));width:0%;transition:width .35s ease;}
.sv-count{font-size:13px;font-weight:700;color:var(--brown);flex-shrink:0;}
.sv-anchor{margin-top:14px;font-size:12px;color:var(--soft);text-align:center;}
.sv-cat{margin-top:34px;}
.sv-title{margin-top:18px;font-size:clamp(23px,6.4vw,27px);font-weight:900;line-height:1.42;color:var(--ink);}
.sv-title .acc{color:var(--gold);}
.sv-hint{margin-top:10px;font-size:14px;color:var(--soft);line-height:1.6;}
.sv-opts{margin-top:26px;display:flex;flex-direction:column;gap:11px;}
.sv-opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#FFFDF8;border:1.5px solid #EFE7D6;border-radius:16px;padding:17px 18px;font-size:15px;font-weight:700;color:var(--ink);line-height:1.45;transition:border-color .12s ease, background .12s ease, transform .08s ease;}
.sv-opt .em{font-size:20px;flex-shrink:0;line-height:1;}
.sv-opt:active{transform:scale(0.985);}
.sv-opt.sel{background:#F3E7D3;border-color:var(--gold);}
/* Q10 마무리 선택과 독립적인 체크박스 (눈시림 회피) */
.sv-extra{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#FFFDF8;border:1.5px dashed var(--soft);border-radius:16px;padding:15px 18px;font-size:13.5px;font-weight:700;color:var(--brown);margin-top:4px;transition:border-color .12s ease, background .12s ease;}
.sv-extra .cb{flex-shrink:0;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;}
.sv-extra.on{background:#F3E7D3;border-color:var(--gold);color:var(--ink);}
.sv-extra.on .cb{background:var(--gold);border-color:var(--gold);color:#fff;}
.sv-extra small{display:block;font-weight:400;color:var(--soft);margin-top:3px;font-size:11.5px;}
.sv-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;}
.sv-back{font-size:15px;color:var(--brown);padding:12px 6px;}
.sv-back:disabled{opacity:0;pointer-events:none;}
.sv-next{background:var(--dark);color:#F5EFE3;font-size:15.5px;font-weight:700;padding:15px 34px;border-radius:999px;transition:opacity .15s ease;}
.sv-next:disabled{opacity:0.35;cursor:default;}

/* ══════════ 로딩 ══════════ */
.ld-wrap{text-align:center;padding-top:90px;}
.ld-title{margin-top:22px;font-size:20px;font-weight:900;}
.ld-sub{margin-top:8px;font-size:13.5px;color:var(--soft);}
.ld-steps{margin:34px auto 0;max-width:250px;text-align:left;display:flex;flex-direction:column;gap:13px;}
.ld-step{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--soft);opacity:0.4;transition:opacity .3s ease;}
.ld-step.on{opacity:1;color:var(--ink);font-weight:700;}
.ld-step .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;}

/* ══════════ 리포트 공통 ══════════ */
.rp{display:flex;flex-direction:column;gap:16px;padding-top:28px;padding-bottom:96px;}
.rp-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;scroll-margin-top:14px;}
/* 섹션 제목 — 좌측 골드 세로바 + 골드 번호배지 (가독성/구분 강화) */
.rp-sec{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-left:11px;border-left:4px solid var(--gold);}
.rp-sn{font-size:10px;background:var(--gold);color:#fff;padding:3px 8px;border-radius:5px;font-weight:800;flex-shrink:0;}
.rp-se{font-size:16px;font-weight:900;color:var(--gold);letter-spacing:-0.01em;}
.rp-sk{margin-left:auto;font-size:10px;color:var(--soft);font-weight:700;letter-spacing:0.08em;}
/* 번호배지 없는 카드(결과저장·한마디)도 같은 좌측 세로바 톤으로 통일 */
.rp-sechead{font-size:16px;font-weight:900;color:var(--gold);letter-spacing:-0.01em;padding-left:11px;border-left:4px solid var(--gold);}
/* 요약 목차 — 2x2 그리드 + 앵커 */
.toc{background:var(--card);border:1.5px solid var(--gold-soft);border-radius:16px;padding:16px 18px;}
.toc-t{font-size:12px;font-weight:900;color:var(--gold);letter-spacing:0.02em;margin-bottom:12px;text-align:center;}
.toc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.toc-i{text-decoration:none;display:flex;align-items:center;gap:8px;background:#FFFDF8;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:12px;font-weight:700;color:var(--ink);}
.toc-i:active{background:#F3E7D3;}
.toc-e{font-size:16px;}
.toc-sub{text-align:center;font-size:11px;color:var(--soft);font-weight:600;margin-top:11px;}
/* 맨 위로 (공유바 바로 위, 우하단 고정) */
.totop{position:fixed;right:16px;bottom:88px;z-index:119;width:42px;height:42px;border-radius:50%;background:rgba(249,245,239,.95);border:1.5px solid var(--line);box-shadow:0 4px 14px rgba(44,36,22,.18);display:flex;align-items:center;justify-content:center;color:var(--brown);font-size:18px;font-weight:800;text-decoration:none;}
/* 키트 타이틀 (제품 추천 섹션 헤더 바로 아래, 중앙 정렬) */
.kit-title{text-align:center;padding:6px 0 16px;}
.kit-emo{font-size:30px;margin-bottom:6px;}
.kit-t{font-size:15px;color:var(--brown);font-weight:600;line-height:1.5;}
.kit-t b{display:block;font-size:20px;color:var(--ink);font-weight:800;margin-top:2px;}
.kit-sub{font-size:11.5px;color:var(--brown);font-weight:500;line-height:1.6;margin-top:9px;}
.kit-sub b{color:var(--gold);font-weight:800;}

/* 히어로 */
.hero{background:linear-gradient(150deg,#241B12 0%,#33271A 60%,#4A3722 100%);border-radius:20px;padding:30px 26px 28px;color:#F5EFE3;position:relative;overflow:hidden;}
.hero .hanja{position:absolute;right:-8px;top:-16px;font-family:var(--serif);font-size:150px;color:rgba(201,161,94,0.12);line-height:1;pointer-events:none;}
.hero-brand{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:0.14em;color:rgba(245,239,227,0.5);text-transform:uppercase;}
.hero-eyebrow{margin-top:22px;font-size:13px;color:var(--gold-soft);font-weight:700;}
.hero-name{font-family:var(--serif);font-size:clamp(34px,10vw,42px);font-weight:700;color:#F0DEBC;line-height:1.25;margin-top:6px;position:relative;z-index:1;}
.hero-canon{margin-top:6px;font-size:12px;color:rgba(245,239,227,0.55);letter-spacing:0.06em;}
.hero-identity{margin-top:18px;font-size:16px;font-weight:700;line-height:1.65;color:#fff;position:relative;z-index:1;}
.hero-symptoms{margin-top:16px;display:flex;flex-direction:column;gap:7px;position:relative;z-index:1;}
.hero-symptom{font-size:13.5px;color:rgba(245,239,227,0.85);line-height:1.55;padding-left:16px;position:relative;}
.hero-symptom::before{content:'·';position:absolute;left:2px;color:var(--gold-soft);font-weight:900;}
.hero-principle{margin-top:20px;background:rgba(201,161,94,0.14);border:1px solid rgba(201,161,94,0.35);border-radius:12px;padding:13px 16px;position:relative;z-index:1;}
.hero-principle .lb{font-size:10.5px;letter-spacing:0.16em;color:var(--gold-soft);font-weight:700;}
.hero-principle .tx{margin-top:4px;font-size:14.5px;font-weight:700;color:#fff;}

.hero-bm{width:40px;height:40px;border:1px solid rgba(201,161,94,0.45);border-radius:12px;color:var(--gold-soft);display:flex;align-items:center;justify-content:center;background:none;position:relative;z-index:2;}
.hero-identity .gd{color:var(--gold-soft);}

/* 공유 */
.share-bar{position:fixed;left:0;right:0;bottom:0;z-index:120;background:rgba(245,239,227,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 22px calc(12px + env(safe-area-inset-bottom));}
.share-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;max-width:436px;margin:0 auto;background:var(--dark);color:#F0DEBC;font-size:15.5px;font-weight:900;padding:17px 10px;border-radius:999px;box-shadow:0 8px 20px rgba(42,33,24,0.22);transition:transform .15s ease;}
.share-btn:active{transform:scale(0.98);}
.sheet-overlay{position:fixed;inset:0;z-index:200;background:rgba(42,33,24,0.45);opacity:0;pointer-events:none;transition:opacity .2s ease;display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(20px + env(safe-area-inset-bottom));}
.sheet-overlay.open{opacity:1;pointer-events:auto;}
.sheet{width:100%;max-width:440px;background:#FDFAF3;border-radius:20px;padding:10px;transform:translateY(16px);transition:transform .2s ease;box-shadow:0 -8px 30px rgba(42,33,24,0.2);}
.sheet-overlay.open .sheet{transform:translateY(0);}
.sheet-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:14px;}
.sheet-item:active{background:#F3EDDF;}
.sheet-ic{flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.sheet-ic.kakao{background:#FEE500;}
.sheet-ic.link{background:#E9E1D0;}
.sheet-item b{display:block;font-size:15px;color:var(--ink);}
.sheet-item small{display:block;font-size:12px;color:var(--soft);margin-top:2px;}

/* 점수 */
.score-rows{display:flex;flex-direction:column;gap:15px;margin-top:16px;}
.score-row .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700;color:var(--ink);}
.score-row .meta .val{font-size:12.5px;color:var(--brown);font-weight:700;}
.score-row .meta .delta{font-size:11px;font-weight:700;margin-left:6px;}
.score-row .delta.up{color:var(--green);}
.score-row .delta.down{color:var(--red);}
.score-track{margin-top:6px;height:8px;border-radius:999px;background:#EDE5D3;overflow:hidden;}
.score-fillbar{height:100%;border-radius:999px;}
.insight-box{margin-top:20px;background:#F8EFDC;border:1px solid #EAD9B8;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--ink);}
.insight-box .lb{display:block;font-size:12px;font-weight:900;color:var(--gold);margin-bottom:5px;}
.praise-box{margin-top:10px;background:#EFF3EA;border:1px solid #D8E2CF;border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--ink);}
.praise-box .lb{display:block;font-size:12px;font-weight:900;color:var(--green);margin-bottom:5px;}
.score-link{margin-top:14px;font-size:13px;color:var(--brown);background:#F3EDDF;border-radius:10px;padding:11px 14px;line-height:1.65;}

/* 로드맵 */
.stage-skip{display:flex;gap:10px;align-items:flex-start;background:#EFF3EA;border:1px solid #D8E2CF;border-radius:12px;padding:13px 15px;margin-top:16px;font-size:13px;line-height:1.65;color:var(--ink);}
.stage-skip .ck{color:var(--green);font-weight:900;flex-shrink:0;}
.stage-now{margin-top:12px;border:1.5px solid var(--gold);border-radius:14px;padding:18px 17px;background:#FCF6E9;}
.stage-now .tag{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:0.1em;background:var(--gold);color:#fff;border-radius:6px;padding:3px 8px;}
.stage-now .nm{margin-top:9px;font-size:16px;font-weight:900;color:var(--gold);}
.stage-now .dur{font-size:12.5px;color:var(--brown);margin-top:2px;}
.stage-check-lb{margin-top:14px;font-size:12px;font-weight:900;color:var(--gold);}
.stage-checks{margin-top:8px;display:flex;flex-direction:column;gap:8px;}
.stage-checks .it{display:flex;gap:9px;font-size:13px;color:var(--ink);line-height:1.55;}
.stage-checks .bx{flex-shrink:0;width:16px;height:16px;border:1.5px solid var(--gold-soft);border-radius:5px;margin-top:2px;}
.stage-next{margin-top:12px;border:1px dashed var(--line);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--soft);line-height:1.6;}
.stage-next b{color:var(--brown);}

/* 성분 */
.ing-group-lb{margin-top:18px;font-size:12.5px;font-weight:900;letter-spacing:0.08em;}
.ing-group-lb.now{color:var(--gold);}
.ing-group-lb.next{color:var(--soft);}
.ing-item{display:flex;gap:13px;margin-top:12px;background:#FFFDF8;border:1px solid #EFE7D6;border-radius:13px;padding:15px 16px;}
.ing-item.dim{opacity:0.7;}
.ing-item .em{font-size:22px;flex-shrink:0;line-height:1.3;}
.ing-item .nm{font-size:14.5px;font-weight:900;color:var(--ink);}
.ing-item .nick{display:inline-block;font-size:11px;font-weight:700;color:var(--gold);background:#F5EBD7;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:1px;}
.ing-item .ds{font-size:13px;color:var(--brown);line-height:1.6;margin-top:4px;}
.ing-avoid{margin-top:12px;background:#F8E9E4;border:1px solid #EBCFC6;border-radius:13px;padding:15px 16px;}
.ing-avoid .nm{font-size:14px;font-weight:900;color:var(--pink-tx);}
.ing-avoid .ds{font-size:13px;color:#9B5B49;line-height:1.6;margin-top:4px;}

/* 키트 */
.wash-card{margin-top:16px;background:var(--dark);border-radius:14px;padding:17px 18px;color:#F5EFE3;}
.wash-card .lb{font-size:12.5px;font-weight:900;color:var(--gold-soft);}
.wash-card .lb small{font-weight:500;color:rgba(245,239,227,0.55);margin-left:6px;font-size:11px;}
.wash-lines{margin-top:9px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:rgba(245,239,227,0.88);line-height:1.55;}
/* 클렌저 추천 접기/펴기 (세안 규칙 카드 안, 다크 배경용) */
.cl-more{margin-top:11px;padding-top:11px;border-top:1px dashed rgba(245,239,227,0.25);}
.cl-more summary{list-style:none;cursor:pointer;font-size:12px;font-weight:900;color:var(--gold-soft);display:flex;align-items:center;justify-content:space-between;}
.cl-more summary::-webkit-details-marker{display:none;}
.cl-more .chev{font-size:15px;transition:transform .2s;}
.cl-more[open] .chev{transform:rotate(45deg);}
.cl-body{margin-top:10px;padding:11px 12px;background:rgba(245,239,227,0.08);border-radius:9px;}
.cl-p{font-size:12.5px;color:rgba(245,239,227,0.85);line-height:1.65;margin-bottom:9px;}
.cl-p b{color:#fff;font-weight:800;font-size:13px;}
.slot{margin-top:14px;border:1px solid var(--line);border-radius:15px;padding:17px 16px;background:#FFFDF8;}
.slot-top{display:flex;align-items:center;gap:11px;}
.slot-no{flex-shrink:0;width:28px;height:28px;border-radius:50%;background:var(--dark);color:#F0DEBC;font-size:13.5px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.slot-label{font-size:12px;font-weight:900;letter-spacing:0.06em;color:var(--gold);}
.slot-name{margin-top:10px;font-size:15.5px;font-weight:900;color:var(--ink);line-height:1.45;}
.slot-price{font-size:13px;color:var(--brown);font-weight:700;margin-top:2px;}
.slot-why{margin-top:8px;font-size:13px;color:var(--brown);line-height:1.65;}
.slot-use{margin-top:10px;background:#F3EDDF;border-radius:10px;padding:10px 13px;font-size:12.5px;line-height:1.6;color:var(--ink);}
.slot-use b{color:var(--gold);font-size:11px;letter-spacing:0.1em;margin-right:6px;}
.slot-oy{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;width:100%;background:var(--coupang);color:#fff;font-size:13.5px;font-weight:900;padding:12px 10px;border-radius:10px;}
.slot-note{margin-top:9px;font-size:12.5px;color:var(--brown);background:#F8F3E8;border-radius:10px;padding:10px 13px;line-height:1.6;}
.kit-core-note{margin-top:16px;font-size:13.5px;font-weight:700;color:var(--ink);background:#F8EFDC;border:1px solid #EAD9B8;border-radius:12px;padding:13px 15px;line-height:1.65;}
.kit-price-note{margin-top:10px;font-size:12px;color:var(--soft);line-height:1.6;}
.conflict-card{margin-top:14px;background:#F8E9E4;border:1px solid #EBCFC6;border-radius:13px;padding:15px 16px;}
.conflict-card .lb{font-size:13px;font-weight:900;color:var(--pink-tx);}
.conflict-card .it{font-size:13px;color:#9B5B49;line-height:1.65;margin-top:7px;}
.oy-about{margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:14px 15px;font-size:12.5px;color:var(--brown);line-height:1.7;}
.oy-about b{color:var(--ink);}
/* 공정위 문구(경제적 이해관계 표기) — 접히지 않고 항상 노출, 충분한 대비 */
.ftc-top{margin-bottom:14px;padding:12px 14px;background:#F3EDDF;border:1.5px solid var(--gold-soft);border-radius:10px;font-size:12px;color:var(--ink);font-weight:700;line-height:1.65;text-align:center;}
.ftc-rule{border:none;border-top:1px dashed rgba(140,115,85,.35);margin:11px 0;}
.ftc-bottom{font-size:12px;font-weight:700;color:var(--ink);line-height:1.7;}

/* 링크 저장 / 별점 / 후원 */
.link-url{display:flex;gap:8px;margin-top:14px;}
.link-url input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#FFFDF8;padding:12px 13px;font-size:12.5px;color:var(--brown);font-family:var(--sans);}
.link-copy{flex-shrink:0;background:var(--dark);color:#F5EFE3;font-size:13px;font-weight:700;padding:0 18px;border-radius:10px;}
.link-desc{margin-top:12px;font-size:13px;color:var(--brown);line-height:1.7;}
.stars{display:flex;gap:10px;justify-content:center;margin-top:16px;}
.star{font-size:34px;color:#DACFB8;transition:color .1s ease, transform .1s ease;line-height:1;}
.star.on{color:var(--gold);}
.star:active{transform:scale(1.15);}
.fb-text{width:100%;margin-top:16px;border:1px solid var(--line);border-radius:12px;background:#FFFDF8;padding:13px 14px;font-size:13.5px;font-family:var(--sans);color:var(--ink);resize:vertical;min-height:74px;}
.fb-submit{margin-top:12px;width:100%;background:var(--dark);color:#F5EFE3;font-size:14.5px;font-weight:700;padding:15px 10px;border-radius:999px;}
.fb-submit:disabled{opacity:0.4;}
.fb-done{margin-top:14px;text-align:center;font-size:13.5px;color:var(--green);font-weight:700;}
.disclaimer{text-align:center;font-size:11.5px;color:var(--soft);line-height:1.7;padding:8px 10px 0;}
.retake-btn{display:block;text-align:center;margin-top:6px;font-size:13px;color:var(--brown);text-decoration:underline;text-underline-offset:3px;}

/* ══ v4 신규 ══ */
.opt-tx{display:block;}
.opt-sub2{display:block;font-weight:400;font-size:11.5px;color:var(--soft);margin-top:4px;line-height:1.5;}
/* 응급 배너 */
.emg-banner{background:linear-gradient(150deg,#3A2A16,#4A3520);border:1px solid var(--gold-soft);border-radius:18px;padding:22px 22px;color:#F5EFE3;margin-bottom:4px;}
.emg-title{font-size:16px;font-weight:900;color:#F0DEBC;}
.emg-body{font-size:13.5px;line-height:1.75;color:rgba(245,239,227,0.9);margin-top:9px;}
.emg-body b{color:#fff;}
.emg-tag{margin-top:12px;font-size:12px;color:var(--gold-soft);font-weight:700;}
/* 8주 근거 노트 */
.road-note{background:#F3EDDF;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.7;color:var(--ink);}
.road-note b{color:var(--gold);}
/* 성분 2단 */
.ing-intro{margin-top:8px;font-size:13px;color:var(--brown);line-height:1.65;}
.ing-item{display:block;}
.ing-top{display:flex;gap:13px;}
.ing-deep{margin-top:11px;border-radius:8px;overflow:hidden;}
.ing-deep summary{cursor:pointer;list-style:none;font-size:11.5px;font-weight:900;letter-spacing:0.04em;color:var(--gold);padding:10px 12px;background:#F3EDDF;display:flex;align-items:center;gap:7px;}
.ing-deep summary::-webkit-details-marker{display:none;}
.ing-deep summary::before{content:'+';font-size:14px;line-height:1;width:13px;text-align:center;}
.ing-deep[open] summary::before{content:'\2212';}
.ing-deep-body{padding:12px 14px;background:#F8F3E8;border-left:3px solid var(--gold-soft);font-size:12.5px;line-height:1.75;color:var(--brown);}
/* 플래그 고지 */
.flag-note{margin-top:14px;background:#F8E9E4;border:1px solid #EBCFC6;border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.75;color:#9B5B49;}
.flag-note.soft{background:#F8F3E8;border-color:#E7DCC8;color:var(--brown);}
/* 액티브 노트 */
.active-note{margin-top:16px;background:#EFF3EA;border:1px solid #D8E2CF;border-radius:12px;padding:15px 16px;font-size:13px;line-height:1.7;color:var(--ink);}
.active-note.soft{background:#F3EDDF;border-color:var(--line);}
.an-lb{font-size:13px;font-weight:900;color:var(--green);margin-bottom:6px;}
.sub-list{margin-top:10px;display:flex;flex-direction:column;gap:9px;}
.sub-item{background:#FFFDF8;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.6;}
.sub-item .to{color:var(--gold);}
.sub-item span{color:var(--brown);}
.sub-oy{display:inline-flex;align-items:center;gap:5px;margin-top:8px;background:var(--coupang);color:#fff;font-size:12px;font-weight:900;padding:7px 12px;border-radius:8px;text-decoration:none;}
.flag-note .sub-oy{margin-top:10px;}
.proto-list{margin-top:9px;display:flex;flex-direction:column;gap:5px;}
.proto-item{font-size:12.5px;color:var(--brown);line-height:1.55;}
/* 04→05 연결 문구 — 04는 지식만, 제품은 05에서만(FIX_액티브대체_렌더링.md) */
.ing-connector{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(140,115,85,.3);font-size:12.5px;color:var(--gold);font-weight:700;line-height:1.6;}
/* 판정 배지 */
.v-badge{margin-left:auto;flex-shrink:0;font-size:10.5px;font-weight:900;padding:3px 9px;border-radius:999px;letter-spacing:0.02em;}
.v-best{background:#EFF3EA;color:#5C7A4A;}
.v-worth{background:#F3EAD9;color:#9A7433;}
.v-gem{background:#E9E3F0;color:#6C5A8C;}
.v-form{background:#F0EDE3;color:#7A6A45;}
.v-over{background:#F5DFD6;color:var(--pink-tx);}
.slot-top{flex-wrap:wrap;}
.why-lb{display:block;font-size:11px;font-weight:900;letter-spacing:0.04em;color:var(--gold);margin-bottom:3px;}
/* 루프 섹션 */
.loop-card{position:relative;overflow:hidden;background:linear-gradient(150deg,#241B12 0%,#33271A 60%,#4A3722 100%);border-radius:20px;padding:30px 26px;color:#F5EFE3;text-align:center;}
.loop-inf{position:absolute;right:-10px;bottom:-30px;font-family:var(--serif);font-size:150px;color:rgba(201,161,94,0.1);line-height:1;pointer-events:none;}
.loop-head{position:relative;z-index:1;font-size:19px;font-weight:900;line-height:1.5;color:#F0DEBC;}
.loop-body{position:relative;z-index:1;margin-top:14px;font-size:13.5px;line-height:1.8;color:rgba(245,239,227,0.88);}
.loop-note{position:relative;z-index:1;margin-top:16px;background:rgba(201,161,94,0.12);border:1px solid rgba(201,161,94,0.3);border-radius:12px;padding:13px 15px;font-size:12.5px;line-height:1.75;color:rgba(245,239,227,0.9);text-align:left;}
.loop-wink{position:relative;z-index:1;margin-top:16px;font-size:12.5px;color:var(--gold-soft);}
</style>
</head>
<body>

<div class="page" id="top">

  <!-- ══ 설문 ══ -->
  <div id="survey-view">
    <div class="sv-top">
      <span class="sv-qno" id="sv-qno">Q1</span>
      <div class="sv-bar"><div class="sv-fill" id="sv-fill"></div></div>

    <svg class="sv-cat" width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 24 L10 10 L26 19" stroke="#B98A44" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

        <circle cx="39" cy="35" r="1.8" fill="#3A2E20"/>
        <path d="M27 42 Q32 46 37 42" stroke="#B98A44" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      </svg>
      <div class="ld-title">주인장이 살펴보는 중이에요</div>
      <div class="ld-sub">잠깐이면 돼요, 60초 안에 끝나요</div>
      <div class="ld-steps" id="ld-steps">
        <div class="ld-step" id="ld-1"><span class="dot"></span>답변 확인하는 중</div>
        <div class="ld-step" id="ld-2"><span class="dot"></span>피부 타입 찾는 중</div>
        <div class="ld-step" id="ld-3"><span class="dot"></span>장벽 점수 계산하는 중</div>
        <div class="ld-step" id="ld-4"><span class="dot"></span>성분 고르는 중</div>
        <div class="ld-step" id="ld-5"><span class="dot"></span>키트에 담는 중</div>
      </div>
    </div>
  </div>

  <!-- ══ 리포트 ══ -->
  <div id="report-wrap" class="rp hidden"></div>

</div>

<script>
/* ══════════════════════════════════════════════
   KR 설문 v4 — 베이스 11 + 조건부 7
   원칙: 관찰을 묻는다 · 조건부로 깊이 · 답이 처방을 갈라야 한다
   파일 id ≠ 표시번호 (survey_v4_final.md 매핑)
     Q1고민(q1) └Q1b(q1b)  Q2최근2주(q6)  Q3세안직후(q2)  Q4미드데이(q3)
     Q5트러블(q4)  Q6제품반응(q8) └Q6a(q6a)/Q6b(q6b)/Q6c(q6c)/Q6d(q5b)
     Q7액티브(qact) └Q7a/Q7b/Q7c  Q8제형(qtex)  Q9실외(q7)  Q10선크림(qsun)  Q11가격(qbudget)
══════════════════════════════════════════════ */
var LOCALE = 'ko';
var TOTAL_MAIN_Q = 11;

var QUESTIONS_KR = [
  /* Q1 · 피부 고민 (전체 선택 → 시스템 우선순위 2개) */
  { id:'q1', num:1, type:'multi',
    text:'요즘 신경 쓰이는 <span class="acc">피부 고민</span>을 모두 골라주세요',
    hint:'다 골라도 괜찮아요. 그중 지금 가장 급한 2가지를 순서대로 잡아드릴게요.',
    options:[

  /* Q1b · 브라이트닝 심화 (조건부: Q1 칙칙함·잡티) — 색소 4분기 + PIE */
  { id:'q1b', num:1, sub:true, type:'multi',
    conditional:{ q:'q1', values:['칙칙함·잡티 — 톤이 고르지 않아요'] },
    text:'밝게 하고 싶은 게 <span class="acc">어떤 쪽</span>이에요?',
    hint:'복수 선택 가능 · 정확히 골라야 딱 맞는 성분을 드려요',
    options:[

      { e:'🟫', t:'여드름 자국이 갈색으로 남아요' },

      { e:'🤷', t:'잘 모르겠어요' }
    ]},
  /* Q1c · 주사(rosacea) 감지 (조건부: Q1 홍조) — 구 Q6c에서 이동 */
  { id:'q1c', num:1, sub:true, optional:true, type:'multi',
    conditional:{ q:'q1', values:['얼굴이 자주 붉어져요 (홍조)'] },

  { id:'q6', num:2, type:'single',

  { id:'q2a', num:2, sub:true, type:'single',
    conditional:{ q:'q6', values:['평소보다 살짝 안 좋아요','갑자기 확 나빠졌어요'] },

    options:[

      { e:'✨', t:'이마(T존)만 묻어나요' },
      { e:'😌', t:'아무것도 안 묻고 편안해요' },
      { e:'🏜️', t:'안 묻는데 오히려 당겨요' }

  { id:'q4', num:5, type:'single',
    text:'요즘 올라오는 <span class="acc">트러블</span>이 있나요?',

      { e:'🃏', t:'웬만한 제품에 다 예민하게 반응해요' },
      { e:'💪', t:'별문제 없이 잘 맞는 편이에요', ex:true }

  /* Q6d · 회피 성분 (조건부: Q6 알러지성) */
  { id:'q5b', num:6, sub:true, optional:true, type:'multi',
    conditional:{ q:'q8', values:['다음날 빨개지거나 두드러기가 올라왔어요'] },

function scoreAnswersKR(ans) {
  var S = { hydration:0, oil:0, combo:0, sensitivity:0, barrier_damage:0, acne:0, pigmentation:0, aging:0, uv_exposure:0 };
  var T = [];
  function addTag(t){ if (T.indexOf(t) === -1) T.push(t); }
  function apply(m){
    if (!m) return;
    Object.keys(m.scores).forEach(function(k){ S[k] = (S[k]||0) + m.scores[k]; });
    m.tags.forEach(addTag);
  }
  ['q6','q2a','q2','q3','q4','qact','qactb','qactc','qtex','q7','qsun','qbudget'].forEach(function(qid){
    var val = (ans[qid]||[])[0];
    if (val) apply((ANSWER_MAP_KR[qid]||{})[val]);
  });
  ['q1','q1b','q1c','q8','q5b','qacta'].forEach(function(qid){
    (ans[qid]||[]).forEach(function(opt){ apply((ANSWER_MAP_KR[qid]||{})[opt]); });
  });
  /* 목표 = 우선순위 1위 */
  var first = prioritizeConcerns(ans.q1)[0];
  if (first && GOAL_FROM_Q1[first]) addTag(GOAL_FROM_Q1[first]);
  addTag('budget:any');
  /* Q10 눈시림 회피 체크박스 — 마무리 선택(qsun)과 독립. 켜져 있으면 마무리와 무관하게 필터 우선 적용 */
  if ((ans.qsun_eye || []).indexOf('on') !== -1) addTag('no-organic');
  return { scores:S, tags:T };

/* ══════════════════════════════════════════════
   플래그 산출 (v4 — 응급/주사/아토피/기미/PIH/액티브/예산)
══════════════════════════════════════════════ */
function computeFlags(ans, tags) {
  function has(t){ return tags.indexOf(t) !== -1; }
  var f = {};
  /* 응급형 = 상태 플래그 (Q2a). sudden-worsening 단독은 응급 아님 — Q2a로 확정 */
  f.emergency_state = has('emergency-onset');
  f.emergency_triggered = has('emergency-triggered');
  /* 만성 민감 = 화들짝형 라우팅 (응급이면 제외). Q2a "원래 자주" + Q6 민감 신호 */
  f.chronic_sensitive = !f.emergency_state && (has('chronic-onset') || has('very-sensitive') || has('low-threshold') || has('immediate-react'));
  /* 피부과 플래그 */
  f.derm_referral_acne    = has('derm-referral-acne');
  f.derm_referral_rosacea = has('rosacea-sign');
  /* ⚠️ 2026-07-29 product_db_슬롯매칭_작업방.md — 번들번들형 마무리보습 슬롯의 트러블 동반 분기용.
     심한 트러블(derm_referral_acne)은 이미 피부과 안내로 별도 처리되니, 여기선 경증~중등도만 잡음 */
  f.trouble_concern = has('acne-concern') || has('acne-prone') || has('frequent-breakout') || has('inflammatory-mild');
  /* 브라이트닝 (PIE = 미백 배제) */
  f.melasma = has('melasma');
  f.pih     = has('pih');
  f.pie     = has('pie');
  f.atopy   = has('atopy');
  /* 액티브 내성 */
  f.active_tolerant    = has('active_tolerant');
  f.active_naive       = has('active_naive');
  f.active_method_fail = has('active_method_fail');
  f.active_intolerant  = has('active_intolerant');
  f.active_avoid       = has('active_avoid');
  f.active_fail = {};
  if (has('active-fail:exfoliant')) f.active_fail.exfoliant = true;
  if (has('active-fail:retinol'))   f.active_fail.retinol = true;
  if (has('active-fail:vitc'))      f.active_fail.vitc = true;
  f.active_want = has('active-want:retry') ? 'retry' : (has('active-want:gentle') ? 'gentle' : (f.active_avoid ? 'avoid' : null));
  /* 예산 */
  f.budget = has('budget_value') ? 'value' : (has('budget_mid') ? 'mid' : (has('budget_premium') ? 'premium' : (has('budget_open') ? 'open' : 'mid')));
  /* 선크림 마무리 (Q10) — 유기/무기 매핑 금지, finish로 직접 필터 */
  f.finish = has('finish:toneup') ? 'toneup' : (has('finish:base') ? 'base' : (has('finish:natural') ? 'natural' : 'default'));
  /* 눈시림 회피 = 유기자차·화학필터 제외 (무기자차만) */
  f.no_organic = has('no-organic');
  /* 제형 */
  f.texture = has('texture:light') ? 'light' : (has('texture:rich') ? 'rich' : 'unknown');
  return f;
}

/* ══════════════════════════════════════════════
   아키타입 분류 (v4 — 민감 먼저, 그다음 유수분)
   내부 키 유지 (마이그레이션 리스크 최소화):
     dehydrated_sensitive = 화들짝형 (만성 민감 전담)
     dry_sensitive        = 파사삭형 (재정의: 건조 + 장벽 건강)  ⚠️ "민감" 의미 아님
══════════════════════════════════════════════ */
function classifyArchetypeKR(S, tags, flags) {
  flags = flags || {};
  function has(t){ return tags.indexOf(t) !== -1; }

  /* 1) 민감(만성 장벽 약화) 먼저 판정 → 화들짝형 전담.
        단, 응급형(요즘 갑자기)은 원래 타입으로 진단하고 배너만 오버레이 */
  var strongSensitive = (S.sensitivity >= 2) || flags.chronic_sensitive || has('chronic-onset');
  if (strongSensitive && !flags.emergency_state) return 'dehydrated_sensitive';

  /* 2) 장벽 건강한 사람을 유수분으로 분류 */
  var trueOily  = has('true-oily') || has('all-over-shine');
  var midDry    = has('patchy-dry') || has('very-dry');
  var tzone     = has('combo') || has('t-zone-oily');
  var afterCleanDry  = S.hydration <= -1;
  var afterCleanOily = S.oil >= 1;
  var isDehydratedOily = afterCleanDry && (trueOily || tzone);
  var isTrueOily = afterCleanOily && trueOily && !midDry;
  var mildlyDry = S.hydration <= -1;

  if (isDehydratedOily && tzone) return 'combination_dehydrated';
  if (isDehydratedOily)          return 'dehydrated_oily';
  if (isTrueOily)                return 'balanced_oily';
  if (tzone)                     return mildlyDry ? 'combination_dehydrated' : 'balanced_oily';
  if (S.oil >= 1 && !mildlyDry)  return 'balanced_oily';
  /* 건조 + 장벽 건강 = 파사삭형 (재정의) */
  if (mildlyDry)                 return 'dry_sensitive';
  /* 균형 = 이상형 */
  return 'balanced_normal';
}

/* ══════════════════════════════════════════════
   대시보드 점수 (정합성: 파사삭=장벽양호 / 화들짝=장벽낮음)
══════════════════════════════════════════════ */
function computeDashKR(S) {
  function clamp(v){ return Math.max(10, Math.min(90, Math.round(v))); }
  return {
    oil_balance: clamp(40 + (S.oil || 0) * 15),
    hydration:   clamp(50 + (S.hydration || 0) * 15),
    barrier:     clamp(70 - (S.barrier_damage || 0) * 10),
    sensitivity: clamp(20 + (S.sensitivity || 0) * 18)
  };
}
function axisLabel(axis, v) {
  if (axis === 'oil_balance')  return v >= 65 ? '높음' : (v >= 45 ? '보통' : '낮음');
  if (axis === 'hydration')    return v >= 65 ? '충분' : (v >= 45 ? '보통' : '부족');
  if (axis === 'barrier')      return v >= 65 ? '튼튼' : (v >= 50 ? '양호' : '주의');
  return v >= 65 ? '높음' : (v >= 45 ? '보통' : '낮음');
}
function axisColor(axis, v) {
  if (axis === 'oil_balance')  return v >= 65 ? 'var(--red)' : 'var(--gold-soft)';
  if (axis === 'hydration')    return v < 45 ? 'var(--red)' : 'var(--gold-soft)';
  if (axis === 'barrier')      return v < 50 ? 'var(--red)' : 'var(--green)';
  return v >= 65 ? 'var(--red)' : (v >= 45 ? 'var(--gold-soft)' : 'var(--blue)');
}

var answers = {};
var currentIdx = 0;
/* ⚠️ 2026-07-29 KR_데이터수집_GA4.md — kr_survey_abandon 판정용. 완료 전 이탈만 잡기 위한 플래그 */
var _surveyCompleted = false;

function visibleQuestions() {
  return QUESTIONS_KR.filter(function(q){
    if (!q.conditional) return true;
    var vals = answers[q.conditional.q] || [];
    return vals.some(function(v){ return q.conditional.values.indexOf(v) !== -1; });
  });
}

function renderQ() {
  var qs = visibleQuestions();
  if (currentIdx >= qs.length) { finishSurvey(); return; }
  var q = qs[currentIdx];
  document.getElementById('sv-qno').textContent = 'Q' + q.num;
  document.getElementById('sv-count').textContent = q.num + '/' + TOTAL_MAIN_Q;
  document.getElementById('sv-fill').style.width = Math.round(q.num / TOTAL_MAIN_Q * 100) + '%';
  document.getElementById('sv-title').innerHTML = q.text;
  document.getElementById('sv-hint').textContent = q.hint || '';

  var sel = answers[q.id] || [];
  var wrap = document.getElementById('sv-opts');
  var optsHtml = q.options.map(function(o, i){
    var on = sel.indexOf(o.t) !== -1;
    return '<button type="button" class="sv-opt' + (on ? ' sel' : '') + '" data-i="' + i + '">' +
      '<span class="em">' + o.e + '</span><span class="opt-tx">' + o.t + (o.sub2 ? '<small class="opt-sub2">' + o.sub2 + '</small>' : '') + '</span></button>';
  }).join('');
  /* 마무리 선택과 독립적인 체크박스 (예: Q10 눈시림 회피) — q.type 선택 상태와 무관하게 별도 answers 키로 관리 */
  if (q.extra) {
    var exOn = (answers[q.extra.id] || []).indexOf('on') !== -1;
    optsHtml += '<button type="button" class="sv-extra' + (exOn ? ' on' : '') + '" data-extra="1">' +
      '<span class="cb">✓</span><span class="opt-tx">' + (q.extra.e ? q.extra.e + ' ' : '') + q.extra.label + (q.extra.sub2 ? '<small>' + q.extra.sub2 + '</small>' : '') + '</span></button>';
  }
  wrap.innerHTML = optsHtml;
  Array.prototype.forEach.call(wrap.querySelectorAll('.sv-opt'), function(btn){
    btn.addEventListener('click', function(){ selectOpt(q, parseInt(btn.getAttribute('data-i'), 10)); });
  });
  var exBtn = wrap.querySelector('.sv-extra');
  if (exBtn) {
    exBtn.addEventListener('click', function(){ toggleExtra(q); });
  }

  document.getElementById('sv-back').disabled = currentIdx === 0;
  updateNext(q);
  window.scrollTo({ top:0, behavior:'smooth' });
}

function selectOpt(q, i) {
  var opt = q.options[i];
  var t = opt.t;
  if (q.type === 'multi') {
    var cur = answers[q.id] || [];
    var at = cur.indexOf(t);
    if (at !== -1) { cur.splice(at, 1); }
    else if (opt.ex) { cur = [t]; } /* 배타 선택지: 나머지 해제 */
    else {
      /* 배타 선택지가 이미 선택돼 있으면 해제 */
      cur = cur.filter(function(v){
        var o = q.options.filter(function(oo){ return oo.t === v; })[0];
        return !(o && o.ex);
      });
      if (cur.length < (q.max || 99)) cur.push(t);
    }
    answers[q.id] = cur;
  } else {
    answers[q.id] = [t];
  }
  /* 조건부 하위 문항: 조건이 깨지면 답 초기화 (single·multi 공통) */
  QUESTIONS_KR.forEach(function(sub){
    if (sub.conditional && sub.conditional.q === q.id) {
      var vals = answers[q.id] || [];
      var met = vals.some(function(v){ return sub.conditional.values.indexOf(v) !== -1; });
      if (!met) delete answers[sub.id];
    }
  });
  renderQ_keepScroll(q);
}

/* 독립 체크박스 토글 (예: Q10 눈시림 회피) — 본 질문의 단일/다중 선택 로직과 완전히 분리 */
function toggleExtra(q) {
  if (!q.extra) return;
  var cur = answers[q.extra.id] || [];
  answers[q.extra.id] = (cur.indexOf('on') !== -1) ? [] : ['on'];
  renderQ_keepScroll(q);
}

function renderQ_keepScroll(q) {
  var sel = answers[q.id] || [];
  Array.prototype.forEach.call(document.querySelectorAll('#sv-opts .sv-opt'), function(btn){
    var t = q.options[parseInt(btn.getAttribute('data-i'), 10)].t;
    btn.classList.toggle('sel', sel.indexOf(t) !== -1);
  });
  if (q.extra) {
    var exBtn = document.querySelector('#sv-opts .sv-extra');
    if (exBtn) exBtn.classList.toggle('on', (answers[q.extra.id] || []).indexOf('on') !== -1);
  }
  updateNext(q);
}

function updateNext(q) {
  var next = document.getElementById('sv-next');
  var n = (answers[q.id]||[]).length;
  if (q.type === 'multi' && q.optional) {
    next.disabled = false;
    next.textContent = n ? '다음 →' : '건너뛰기 →';
  } else if (q.type === 'multi') {
    next.disabled = !n;
    next.textContent = '다음 →';
  } else {
    next.disabled = !n;
    next.textContent = '다음 →';
  }
}

function nextQ() {
  var qs = visibleQuestions();
  /* ⚠️ 2026-07-29 KR_데이터수집_GA4.md — 각 문항 답변 완료 시 kr_survey_q{N} 발화 */
  var qDone = qs[currentIdx];
  if (qDone) {
    trackEvent('kr_survey_q' + qDone.num, { question: qDone.id, answer: (answers[qDone.id] || []).join(',') });
  }
  if (currentIdx < qs.length - 1) { currentIdx++; renderQ(); }
  else finishSurvey();
}
function prevQ() {
  if (currentIdx > 0) { currentIdx--; renderQ(); }
}

function finishSurvey() {
  document.getElementById('survey-view').classList.add('hidden');
  var ld = document.getElementById('loading-view');
  ld.classList.remove('hidden');
  [1,2,3,4,5].forEach(function(n, i){
    setTimeout(function(){
      var el = document.getElementById('ld-' + n);
      if (el) el.classList.add('on');
    }, 320 * (i + 1));
  });
  setTimeout(function(){
    ld.classList.add('hidden');
    var result = scoreAnswersKR(answers);
    var flags = computeFlags(answers, result.tags);
    var archetype = classifyArchetypeKR(result.scores, result.tags, flags);
    var dash = computeDashKR(result.scores);
    window._krProfile = { archetype:archetype, scores:result.scores, tags:result.tags, flags:flags, dash:dash, answers:answers };
    _surveyCompleted = true;
    renderReport(window._krProfile);
    saveReportKR(window._krProfile);
    /* ⚠️ 2026-07-29 KR_데이터수집_GA4.md — 설문 완료·리포트 조회 이벤트 */
    var stageForTrack = flags.emergency_state ? 1 : getCurrentStageKR(window._krProfile);
    trackEvent('kr_survey_complete', { archetype: archetype, current_stage: stageForTrack });
    trackEvent('kr_report_view', { archetype: archetype, short_id: _shortId });
    trackEvent('kr_card_reveal', { archetype: archetype });
  }, 320 * 6 + 300);
}

/* ══════════════════════════════════════════════

function pickSunscreen(profile, flags) {
  var needGentle = profile.archetype === 'dehydrated_sensitive' || flags.derm_referral_rosacea;
  var finish = flags.finish || 'default';
  /* ⚠️ 2026-07-29 product_db_슬롯매칭_작업방.md — 메이크프렘 자리를 셀퓨전씨 잡티토닝으로 교체(메이크프렘 DB에서 제거) */
  if (finish === 'toneup') return '셀퓨전씨 잡티 토닝 썬스크린';               /* 톤업 = 무기자차 톤업 (눈시림 없음) */
  if (flags.no_organic) return '닥터지 그린 마일드 업 선 플러스';              /* 눈시림 회피 = 최우선, 무기자차만 */
  /* ⚠️ 2026-07-29 신규 — 응급형은 피부과·시술 후에도 쓰는 극저자극 선크림으로 별도 배정.
     (혼합자차라 눈시림 회피와는 겹치지 않게 no_organic 체크를 위에서 먼저 걸러냄) */
  if (flags.emergency_state) return '셀퓨전씨 레이저 UV 썬스크린';            /* 응급형 전용 */
  if (needGentle) return '닥터지 그린 마일드 업 선 플러스';                    /* 화들짝형·로사시아 = 무기자차 */
  /* ⚠️ DB_패치안_매칭규칙.md — natural(자연스러운 마무리) + 눈시림 회피 안 함 → 유기자차로.
     기존엔 무기자차만 있어서 눈시림 상관없는 유저에게도 계속 무기자차가 나갔던 공백을 메움. */
  if (finish === 'natural') return '구달 맑은 어성초 진정 수분 선크림';        /* 자연·눈시림 무관 = 유기자차(가볍고 백탁없음) */
  return '라운드랩 자작나무 수분 선크림';                                       /* base·default·지성 = 수분 무난(혼합자차) */
}

function buildProtectSlot(profile) {
  var tags = profile.tags || [];
  var flags = profile.flags || {};
  var uvHigh = tags.indexOf('high-uv') !== -1;
  var uvMid  = tags.indexOf('moderate-uv') !== -1;
  var uvLabel = uvHigh ? '하루 3시간 이상' : (uvMid ? '하루 1~2시간' : '실내 위주');
  var needGentle = profile.archetype === 'dehydrated_sensitive' || flags.emergency_state || flags.derm_referral_rosacea;
  var finish = flags.finish || 'default';
  var name = pickSunscreen(profile, flags);
  var meta = productMeta(name);
  /* ⚠️ FIX_액티브대체_렌더링.md 4-2 — 조각을 이어붙이지 말고 "근거 한 문장 + 강점 한 문장" 템플릿으로.
     "골랐어요"는 문단당 1회만, 조건이 여러 개 걸려도 문장 수가 늘지 않게. */
  var reasons = ['실외 시간(' + uvLabel + ')'];
  if (flags.no_organic) reasons.push('눈시림 회피');
  else if (finish === 'toneup') reasons.push('톤업 마무리');
  else if (finish === 'base') reasons.push('화장 잘 받는 마무리');
  else if (finish === 'natural') reasons.push('자연스러운 마무리');
  else if (needGentle) reasons.push('민감한 피부');
  var basisTxt = reasons.join(' · ') + '까지 고려해서 골랐어요.';

  var strengthParts = [];
  if (meta.sunscreen_filter === 'inorganic') {
    strengthParts.push(flags.no_organic
      ? '징크·티타늄 무기자차라 눈이 시리지 않아요'
      : '징크·티타늄이 물리적으로 막아주는 무기자차라 자극이 적어요');
    if (meta.whitecast === 'low') strengthParts.push('무기자차치고 백탁이 적어 화장 위에도 무난해요');
  } else if (meta.sunscreen_filter === 'organic') {
    strengthParts.push('유기자차라 가볍게 발리고 백탁이 없어요');
  } else if (flags.emergency_state && meta.sunscreen_filter === 'hybrid') {
    strengthParts.push('시술 후에도 쓰는 저자극 처방이라 지금 같은 회복기에 안전해요');
  }
  if (flags.texture === 'rich') strengthParts.push('리치한 편이라 밀도 있게 발려요');
  else if (flags.texture === 'light') strengthParts.push('가벼운 편이라 산뜻하게 발려요');
  var strengthTxt = strengthParts.length ? ' ' + strengthParts.join(', ') + '.' : '';

  var use = uvHigh ? '아침 + 2~3시간마다 덧바르기 · SPF50+ · PA++++ 확인'
          : (uvMid ? '아침 + 외출 전 · 얼굴·목까지 · 오래 나갈 땐 덧바르기'
                   : '아침 한 번 · 얼굴·목까지 · 실내여도 창가 자외선은 들어와요');
  var slot = { label:'자외선 차단', name:name, price:(typeof meta.price==='number'?meta.price:22000),
    why:basisTxt + strengthTxt,
    use:use, actives:[], coupangUrl:'', verdict:(meta.verdict||'BEST_VALUE'),
    priceReason:(meta.priceReason||'') };
  /* 기본(무난) 선크림만 2만원을 넘음 — 예산형이면 무기자차 대안으로 자동 교체 */
  if (name === '라운드랩 자작나무 수분 선크림') {
    slot.budgetAlt = { name:'닥터지 그린 마일드 업 선 플러스', price:19900 };
  }
  if (uvHigh) slot.moistNote = '💡 밖에 오래 계시네요. 덧바를 땐 스틱 타입(닥터지 그린 마일드 업 선스틱)이 편해요 — 화장 위에도 덧바를 수 있어요.';
  return slot;
}

/* ══════════════════════════════════════════════
   예산(Q11) 필터 — verdict 기반 노출 범위
   ⚠️ OVERPRICED는 예산 무관 항상 제외
══════════════════════════════════════════════ */
function budgetAllows(verdict, budget) {
  if (verdict === 'OVERPRICED') return false;
  if (verdict === 'BEST_VALUE' || verdict === 'HIDDEN_GEM') return true;
  if (verdict === 'FORMULATION_VALUE') return budget !== 'value';
  if (verdict === 'WORTH_IT') return budget === 'premium' || budget === 'open';
  return true;
}

/* 이 타입엔 비싼 성분이 필요 없다 — budget_open/premium인데 필요 성분이 전부 commodity */

  return slots.every(function(s){

    return !m.tier || m.tier === 'commodity';
  });
}

/* ⚠️ 2026-07-29 KR_데이터수집_GA4.md — 섹션 도달 시 kr_report_scroll(section) 1회씩만 발화.
   IntersectionObserver 미지원 환경(구형 브라우저·테스트 환경)에서는 조용히 건너뜀 */
function observeReportScroll() {
  if (typeof IntersectionObserver === 'undefined') return;
  var ids = ['sec-score', 'sec-road', 'sec-ing', 'sec-kit'];
  var seen = {};
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (entry.isIntersecting && !seen[entry.target.id]) {
        seen[entry.target.id] = true;
        trackEvent('kr_report_scroll', { section: entry.target.id });
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if (el) io.observe(el);
  });
}

/* 액티브 내성 노트 — 성분 섹션 하단.
   ⚠️ 04 성분 섹션은 지식 전달 전용 — 제품명·가격·구매 버튼 전부 금지(FIX_액티브대체_렌더링.md).
   제품은 05 제품 추천에서만 보여준다(BHA→PHA는 슬롯 치환, 나머지는 지식으로만 남김). */
function renderActiveNote(flags) {
  if (flags.active_avoid) {
    return '<div class="active-note"><div class="an-lb">🌱 액티브 없이 가는 길</div>' +
      '자극적인 성분은 빼기로 했죠. 그래도 할 게 없는 건 아니에요 — 장벽 회복 → 유수분 안정 → 자외선 차단만 잘해도 피부는 확 좋아져요. 각질은 순한 효소 파우더로, 톤은 나이아신아마이드(액티브 아님)로 대신할게요.</div>';
  }
  if (flags.active_intolerant) {
    var subs = [];
    if (flags.active_fail.exfoliant) subs.push(ACTIVE_SUB.exfoliant);
    if (flags.active_fail.retinol)   subs.push(ACTIVE_SUB.retinol);
    if (flags.active_fail.vitc)      subs.push(ACTIVE_SUB.vitc);
    if (!subs.length) subs.push(ACTIVE_SUB.exfoliant);
    return '<div class="active-note"><div class="an-lb">🔄 순한 대체 성분으로</div>' +
      '천천히 늘렸는데도 자극이었다면 그 성분은 안 맞는 거예요. 억지로 쓰지 말고 순한 걸로 바꿔요.' +
      '<div class="sub-list">' + subs.map(function(s){
        return '<div class="sub-item"><b>' + s.from + '</b> → <b class="to">' + s.to + '</b><br><span>' + s.why + '</span></div>';
      }).join('') + '</div></div>';
  }
  if (flags.active_method_fail || flags.active_want === 'retry') {
    return '<div class="active-note"><div class="an-lb">💪 ' + ADAPT_PROTOCOL.title + '</div>' +
      '처음부터 매일 발라서 자극이 났을 가능성이 커요. 방법만 바꾸면 다시 쓸 수 있어요.' +
      '<div class="proto-list">' + ADAPT_PROTOCOL.steps.map(function(s){ return '<div class="proto-item">· ' + s + '</div>'; }).join('') + '</div></div>';
  }
  if (flags.active_naive) {
    return '<div class="active-note soft"><div class="an-lb">🆕 처음이라면</div>' +
      '액티브는 낮은 농도로 주 1~2회부터 시작해요. 피부가 적응하면 천천히 늘리면 돼요. 급할 것 없어요.</div>';
  }
  return '';
}

  /* ⚠️ 2026-07-29 FIX_3_4단계_키트렌더링.md — stage 1~4 전부 실제 렌더. 2단계만 아키타입별(A.kit) */
  var stage = flags.emergency_state ? 'emergency' : getCurrentStageKR(profile);
  var kit = flags.emergency_state ? EMERGENCY_KIT
    : stage === 1 ? S1_KIT
    : stage === 3 ? buildStage3Kit(profile, flags)
    : stage === 4 ? buildStage4Kit(profile, flags)
    : A.kit;
  var out = '';

  /* 세안 규칙 + 클렌저 추천 접기/펴기 (판정 배지 없이, 제품명·가격·이유·쿠팡 링크만) */
  var cAlt = kit.cleanserAlt || null;
  var cMeta = cAlt ? productMeta(cAlt.name) : {};
  out += '<div class="wash-card"><div class="lb">세안 규칙</div>' +
    '<div class="wash-lines">' + kit.washRules.map(function(r){ return '<div>· ' + r + '</div>'; }).join('') + '</div>' +
    (cAlt ? ('<details class="cl-more"><summary>클렌저 추천 받기 <span class="chev">+</span></summary>' +
      '<div class="cl-body"><div class="cl-p"><b>' + cAlt.name + '</b> · 약 ' + fmtWon(typeof cMeta.price === 'number' ? cMeta.price : 15000) + '<br>' + cAlt.why + '</div>' +
      coupangBtn(cAlt.name) + '</div></details>') : '') +
    '</div>';

  if (flags.emergency_state) {
    out += '<div class="conflict-card"><div class="lb">지금은 회복이 먼저예요</div><div class="it">아래는 놀란 장벽을 위한 응급 루틴이에요. 액티브·향료·알코올·에센셜오일을 전부 뺐어요. 2주 회복 뒤, 저장한 링크로 다시 검사하면 원래 타입 키트로 안내해드려요.</div></div>';
  } else if (stage === 1) {
    /* ⚠️ 2026-07-29 FIX_3_4단계_키트렌더링.md — 이전엔 "아래 키트는 쓰지 마세요" 톤이었는데,
       이제 아래가 바로 1단계에 맞춘 장벽 회복 키트라 사용을 막을 이유가 없음. 안내 톤으로 수정 */
    out += '<div class="conflict-card"><div class="lb">지금은 장벽 회복 단계예요</div><div class="it">아래는 지금 장벽 상태에 맞춘 키트예요. 이 단계를 먼저 끝내면 유수분 → 모공·톤 → 주름 순서로 자연스럽게 넘어가요.</div></div>';
  }

  /* 슬롯 = 아키타입/응급 슬롯 + 자외선 차단(전 타입 공통) */
  var texKey = flags.texture === 'light' ? 'light' : (flags.texture === 'rich' ? 'rich' : '');
  var wantBudget = flags.budget === 'value';
  var slots = kit.slots.concat([buildProtectSlot(profile)]).map(function(s){
    var cur = s;
    if (texKey && cur.alt && cur.alt[texKey]) {
      var merged = Object.assign({}, cur, cur.alt[texKey]);
      merged._texApplied = (texKey === 'light') ? '가벼운 제형' : '리치한 제형';
      cur = merged;
    }
    /* ⚠️ 2026-07-29 product_db_슬롯매칭_작업방.md 2번 — 번들번들형 중 트러블 동반 유저는 마무리 보습을
       닥터지 레드블레미쉬(hydrating + 시카진정)로 치환. 매칭은 label로만(제품명 하드코딩 매칭 금지 원칙과
       동일하게, moisture_type이 아니라 이 슬롯이 "마무리 보습"인지로 판별). 예산형 대안보다 먼저 걸고,
       예산 우선(아래 블록)에서 다시 저렴한 대안으로 덮어쓸 수 있게 순서를 둠. */
    if (stage !== 1 && profile.archetype === 'balanced_oily' && flags.trouble_concern && cur.label === '마무리 보습') {
      var troubleProd = '닥터지 레드 블레미쉬 클리어 수딩 크림';
      var troubleMeta = productMeta(troubleProd);
      if (troubleMeta && troubleMeta.moisture_type === 'hydrating') {
        var withTrouble = Object.assign({}, cur, {
          name: troubleProd,
          why: '트러블이 함께 있다고 하셔서, 시카 진정 성분이 들어간 수분크림으로 바꿨어요. 방향(수분 보충)은 같아요.'
        });
        withTrouble._texApplied = null;
        withTrouble._subNote = '🔄 트러블이 있다고 하셔서 진정 성분이 들어간 수분크림으로 바꿨어요.';
        cur = withTrouble;
      }
    }
    /* 예산(2만원 이하) 선택 시, 슬롯이 여전히 2만원을 넘고 예산형 대안이 있으면 교체 (제형 대안보다 우선) */
    if (wantBudget && cur.budgetAlt && prodPrice(cur) > 20000) {
      var withBudget = Object.assign({}, cur, cur.budgetAlt);
      withBudget._texApplied = null;
      withBudget._subNote = null;
      withBudget._budgetApplied = true;
      cur = withBudget;
    }
    /* ⚠️ FIX_액티브대체_렌더링.md — BHA 불내성이면 실제 슬롯을 PHA 제품으로 치환(예산·제형 대안보다 우선).
       매칭은 반드시 active_type 필드로만(이름·카테고리 매칭 금지). 대체 제품이 없으면 치환하지 않음. */
    var curMeta = productMeta(cur.name);
    if (flags.active_intolerant && flags.active_fail && flags.active_fail.exfoliant && curMeta && curMeta.active_type === 'bha') {
      var subInfo = ACTIVE_SUB.exfoliant;
      var subMeta = subInfo && subInfo.product ? productMeta(subInfo.product) : null;
      if (subMeta && subMeta.active_type === 'pha') {
        var withSub = Object.assign({}, cur, { name: subInfo.product, why: subInfo.why });
        withSub._texApplied = null;
        withSub._budgetApplied = null;
        withSub._subNote = '🔄 ' + subInfo.from + '에 자극이 있었다고 하셔서 ' + subInfo.to + '로 바꿨어요.';
        cur = withSub;
      }
    }
    /* ⚠️ 2026-07-29 FIX_3_4단계_키트렌더링.md — 4단계 레티놀 불내성이면 바쿠치올로 치환 (BHA→PHA와 동일 패턴) */
    if (flags.active_intolerant && flags.active_fail && flags.active_fail.retinol && curMeta && curMeta.active_type === 'retinol') {
      var subInfo2 = ACTIVE_SUB.retinol;
      var subMeta2 = subInfo2 && subInfo2.product ? productMeta(subInfo2.product) : null;
      if (subMeta2 && subMeta2.active_type === 'bakuchiol') {
        var withSub2 = Object.assign({}, cur, { name: subInfo2.product, why: subInfo2.why });
        withSub2._texApplied = null;
        withSub2._budgetApplied = null;
        withSub2.moistNote = null;
        withSub2._subNote = '🔄 ' + subInfo2.from + '에 자극이 있었다고 하셔서 ' + subInfo2.to + '로 바꿨어요.';
        cur = withSub2;
      }
    }
    return cur;
  });

  var STAGE_LABEL = { 1:'1단계 · 장벽 회복', 2:'2단계 · ' + A.stages.s2name, 3:'3단계 · 모공·톤 관리', 4:'4단계 · 저속노화 관리' };
  out += '<div class="ing-group-lb now" style="margin-top:18px;">✦ ' + (flags.emergency_state ? '응급 회복' : STAGE_LABEL[stage]) + ' — 지금 단계 키트</div>';

  var budget = flags.budget;
  slots.forEach(function(slot, i){
    var meta = productMeta(slot.name);
    var verdict = slot.verdict || meta.verdict || 'BEST_VALUE';
    /* ⚠️ 판정 배지(가성비형 등)는 무슨 뜻인지 모른다는 피드백으로 제거 — 가격 논리는 아래 "왜 이 제품이에요?"에 전부 풀어서 설명 */
    var priceReason = slot.priceReason || meta.priceReason || '';
    /* 예산 초과 안내: (a) 판정 등급 기준 초과, (b) 2만원 이하를 골랐는데 예산형 대안도 없이 실제가가 2만원을 넘는 경우 — 둘 다 예산형 대안 적용(_budgetApplied) 시엔 표시 안 함 */
    var priceNow = prodPrice(slot);
    var overBudget = !slot._budgetApplied && !slot._subNote && (
      (!budgetAllows(verdict, budget) && verdict !== 'OVERPRICED') ||
      (budget === 'value' && priceNow > 20000)
    );
    out += '<div class="slot"><div class="slot-top"><span class="slot-no">' + (i + 1) + '</span><span class="slot-label">' + slot.label + '</span></div>' +
      '<div class="slot-name">' + slot.name + '</div>' +
      '<div class="slot-price">' + fmtWon(priceNow) + '</div>' +
      (slot._subNote ? '<div class="slot-note">' + slot._subNote + '</div>' : '') +
      '<div class="slot-why"><span class="why-lb">왜 이 제품이에요?</span>' + slot.why + (priceReason ? ' ' + priceReason : '') + '</div>' +
      '<div class="slot-use"><b>USE</b>' + slot.use + '</div>' +
      (slot._texApplied ? '<div class="slot-note">🧴 ' + slot._texApplied + '이 잘 맞는다고 해서, 같은 라인의 이 제형으로 골랐어요.</div>' : '') +
      (slot._budgetApplied ? '<div class="slot-note">💰 2만원 이하를 원하셔서, 더 저렴한 대안으로 바꿔 골랐어요. 방향(핵심 성분)은 같아요.</div>' : '') +
      (overBudget ? '<div class="slot-note">💵 이 슬롯만 예산을 살짝 넘어요. 효과를 좌우하는 자리라 남겨뒀는데, 더 저렴한 대안이 필요하면 알려주세요.</div>' : '') +
      (slot.moistNote ? '<div class="slot-note">' + slot.moistNote + '</div>' : '') +
      coupangBtn(slot.name) +
      '</div>';
  });

  out += '<div class="kit-core-note">' + kit.coreNote + '</div>';

  /* 예산 높은데 전부 commodity → "비싼 성분 필요 없어요" */
  if ((budget === 'open' || budget === 'premium') && isAllCommodity(kit.slots)) {
    out += '<div class="kit-core-note" style="background:#EFF3EA;border-color:#D8E2CF;">💚 이 타입에 필요한 성분은 전부 흔하고 저렴해요. 비싼 걸 살 이유가 없어요 — 남는 예산은 선크림이나 다음 시즌 재검사에 아껴두세요.</div>';
  }
  out += '<div class="kit-price-note">가격은 쿠팡 기준가예요. 세일 시 더 저렴할 수 있어요.</div>';

  /* 충돌 경고 */
  var allActives = [];
  slots.forEach(function(s){ (s.actives||[]).forEach(function(a){ if (allActives.indexOf(a) === -1) allActives.push(a); }); });
  var conflictMsgs = CONFLICT_PAIRS.filter(function(cp){
    return allActives.indexOf(cp.pair[0]) !== -1 && allActives.indexOf(cp.pair[1]) !== -1;
  });
  if (conflictMsgs.length) {
    out += '<div class="conflict-card"><div class="lb">✕ 이렇게는 쓰지 마세요</div>' +
      conflictMsgs.map(function(cp){ return '<div class="it">' + cp.msg + '</div>'; }).join('') + '</div>';
  }

  /* 피부과 플래그 문구 */
  if (flags.derm_referral_rosacea) out += '<div class="flag-note">🩺 ' + FLAG_NOTES.rosacea + '</div>';
  if (flags.derm_referral_acne)    out += '<div class="flag-note">🩺 ' + FLAG_NOTES.acne + '</div>';
  if (flags.atopy)                 out += '<div class="flag-note">🩺 ' + FLAG_NOTES.atopy + ' ' +
    coupangBtn('에스트라 아토베리어365 크림', { cls:'sub-oy', label:'🛒 에스트라 아토베리어365 크림' }) +
    coupangBtn('일리윤 세라마이드 아토 집중크림', { cls:'sub-oy', label:'🛒 일리윤 세라마이드 아토 집중크림' }) + '</div>';

  /* ⚠️ 공정위 문구(하단) — FIX_액티브대체_렌더링.md 4-3 확정 문구. 링크 유무와 무관하게 항상 노출, 접지 않음.
     핵심 3요소: ①성분·검증만 보고 골랐다 ②다 고른 뒤에 링크를 붙였다(순서 명시, 삭제 금지) ③수수료는 서버 유지비.
     ⚠️ 로켓배송·브랜드 공식판매자 언급은 여기서도 제거(판매자 표기는 화면 어디에도 노출 안 함 — coupang_seller_type은 DB 내부 기록용으로만 유지). */
  out += '<div class="oy-about">🐱 <b>\'쿠팡에서 보기\'에 대하여</b><br>제품은 오직 성분과 검증만 보고 골랐어요. 다 고른 뒤에 링크를 붙였고요. 이 링크로 구매하시면 주인장에게 약간의 수수료가 생기는데, 전부 서버 유지에 써요.' +
    '<hr class="ftc-rule">' +
    '<div class="ftc-bottom">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div></div>';
  return out;
}

var SB_URL = 'https://ijuavefvnfghnyzmyubh.supabase.co';

function sbHeaders() {

}

/* 저장 모드: 'columns' = KR 전용 컬럼(마이그레이션 후) / 'legacy' = 기존 스키마 profile_data jsonb */
var _krSaveMode = null;
var _krRowId = null;
var _krProfileData = null;

function _onSaved(mode, rowId, pd) {
  _krSaveMode = mode; _krRowId = rowId || null; _krProfileData = pd || null;
  var input = document.getElementById('report-link');
  if (input) input.value = location.origin + location.pathname + '?r=' + _shortId;
  /* 유저를 저장된 URL 위에 올려둠 → 쿠팡 갔다 뒤로 와도, 새로고침해도 결과 유지 */
  try { history.replaceState(null, '', location.pathname + '?r=' + _shortId); } catch(e) {}
}
function _onSaveFail() {
  var input = document.getElementById('report-link');
  if (input) input.value = '지금은 링크 저장이 안 돼요 — 잠시 뒤 다시 해보세요';
  _shortId = null;
}

function saveReportKR(profile) {
  _shortId = Math.random().toString(36).slice(2, 10);
  var parent = null;
  try { parent = JSON.parse(sessionStorage.getItem('kr_parent_report') || 'null'); } catch(e) {}
  try { sessionStorage.removeItem('kr_parent_report'); } catch(e) {}

  /* ⚠️ 2026-07-29 KR_데이터수집_GA4.md — reports 테이블 스키마에 있는 current_stage(int, NOT NULL 추정)가
     빠져 있으면 1차 insert가 통째로 실패해서 계속 2차(legacy)로 폴백하거나, 2차마저 안 맞으면 완전히
     저장이 안 될 수 있음. current_stage를 채워서 저장. answers에는 flags도 같이 동봉(_flags) — 원본
     답변은 그대로 유지하고, scoreAnswersKR/computeFlags 재계산 경로는 _flags를 무시하므로 안전함. */
  var stageForSave = (profile.flags && profile.flags.emergency_state) ? 1 : getCurrentStageKR(profile);
  var answersWithFlags = Object.assign({}, profile.answers, { _flags: profile.flags });

  /* 1차: KR 전용 컬럼 (Supabase에 마이그레이션 SQL 적용 시 이 경로 사용) */
  var body = {
    short_id: _shortId,
    archetype: profile.archetype,
    current_stage: stageForSave,
    scores: { raw: profile.scores, dash: profile.dash },
    answers: answersWithFlags,
    locale: 'ko',
    parent_report_id: parent ? parent.short_id : null
  };
  fetch(SB_URL + '/rest/v1/reports', {
    method:'POST', headers: sbHeaders(), body: JSON.stringify(body)
  }).then(function(res){
    if (res.ok) { _onSaved('columns'); return null; }
    /* 2차 폴백: 기존(EN) 스키마 — profile_data jsonb에 KR 데이터 전부 저장 */
    var pd = {
      kr: true, locale: 'ko', short_id: _shortId, current_stage: stageForSave,
      scores: { raw: profile.scores, dash: profile.dash },
      answers: answersWithFlags, tags: profile.tags,
      parent_short_id: parent ? parent.short_id : null
    };
    var legacy = {
      archetype: profile.archetype,
      subtype_name: (KR_ARCHETYPES[profile.archetype] || {}).kr || '',
      profile_data: pd
    };
    return fetch(SB_URL + '/rest/v1/reports', {
      method:'POST',
      headers: Object.assign({}, sbHeaders(), { 'Prefer': 'return=representation' }),
      body: JSON.stringify(legacy)
    }).then(function(res2){
      if (!res2.ok) { _onSaveFail(); return null; }
      return res2.json().then(function(rows){
        var row = (rows && rows[0]) || {};
        _onSaved('legacy', row.id, pd);
      });
    });
  }).catch(_onSaveFail);
}

function _copyText(t, onDone) {
  var finish = function(ok){ if (onDone) onDone(!!ok); };
  var legacy = function(){
    try {
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      finish(ok);
    } catch(e) { finish(false); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function(){ finish(true); }).catch(legacy);
  } else legacy();
}

function copyReportLink() {
  var input = document.getElementById('report-link');
  if (!input || input.value.indexOf('http') !== 0) return;
  _copyText(input.value, function(ok){
    if (ok) {
      var btn = document.querySelector('.link-copy');
      if (btn) { btn.textContent = '복사됨!'; setTimeout(function(){ btn.textContent = '복사'; }, 1600); }
      trackEvent('kr_link_copy', {});
      trackEvent('kr_save_link', {}); /* ⚠️ 2026-07-29 KR_데이터수집_GA4.md 이름 정합 */
    } else {
      /* 최후: 수동 복사 (PC 구형 브라우저·비보안 컨텍스트) */
      window.prompt('아래 링크를 복사해주세요 (Ctrl+C)', input.value);
    }
  });
}

  var hero = document.querySelector('.hero');
  if (!hero || typeof html2canvas === 'undefined') {
    alert('이미지 저장을 지금은 사용할 수 없어요. 스크린샷으로 저장해주세요.');

  html2canvas(hero, {

    a.click();
  }).catch(function(){
    alert('이미지 저장에 실패했어요. 스크린샷으로 저장해주세요.');
  });
}

/* ══════════════════════════════════════════════
   내 결과 공유하기 — 시트 + 카카오 SDK (폴백: Web Share → 클립보드)
══════════════════════════════════════════════ */
var KAKAO_JS_KEY = ''; /* TODO(하이롱): 카카오 developers JavaScript 키 발급 후 입력 */
var KAKAO_SHARE_IMG = ''; /* TODO(하이롱): 공유 카드 썸네일 이미지 URL (없으면 텍스트 공유로 폴백) */
function _kakaoReady() {
  if (!KAKAO_JS_KEY || typeof Kakao === 'undefined') return false;
  try {
    if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
    return Kakao.isInitialized();
  } catch(e) { return false; }
}
function openShareSheet() {
  var el = document.getElementById('share-sheet');
  if (el) el.classList.add('open');
}
function closeShareSheet() {
  var el = document.getElementById('share-sheet');
  if (el) el.classList.remove('open');
}
function _resultUrl() {
  var input = document.getElementById('report-link');
  return (input && input.value.indexOf('http') === 0) ? input.value : (location.origin + location.pathname);
}
function _mainUrl() {
  /* 메인 파일명이 바뀌어도 동작하도록 폴더 루트(index)로 보냄 */
  return location.origin + location.pathname.replace(/[^\/]*$/, '');
}
function shareResult(mode) {
  trackEvent(mode === 'brag' ? 'kr_share_brag' : (mode === 'recommend' ? 'kr_share_recommend' : 'kr_share_copy'), {});
  trackEvent('kr_share_click', { method: mode }); /* ⚠️ 2026-07-29 KR_데이터수집_GA4.md 통합 이벤트 병행 */
  if (mode === 'copy') {
    var input = document.getElementById('report-link');
    if (input && input.value.indexOf('http') === 0) {
      copyReportLink();
      var sub = document.getElementById('sheet-link-sub');
      if (sub) { sub.textContent = '복사됐어요!'; setTimeout(function(){ sub.textContent = '내 결과 링크를 복사해요'; }, 1600); }
      setTimeout(closeShareSheet, 500);
    } else {
      alert('링크를 만드는 중이에요 — 잠시 뒤 다시 눌러주세요.');
    }
    return;
  }
  var A = KR_ARCHETYPES[(window._krProfile || {}).archetype];
  var isBrag = mode === 'brag';
  var text = (isBrag && A)
    ? ('나는 ' + A.kr + '! — 나에게 맞는 스킨제품 찾기, 1분 피부 타입 테스트')
    : '1분만에 내 피부 타입이랑 꼭 필요한 스킨제품 찾아준대. 해볼래?';
  var url = isBrag ? _resultUrl() : _mainUrl();
  /* 1순위: 카카오 SDK (이미지+텍스트+링크 한 카드) */
  if (_kakaoReady() && KAKAO_SHARE_IMG) {
    try {
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: (isBrag && A) ? ('나는 ' + A.kr + '!') : '나에게 맞는 스킨제품 찾기',
          description: isBrag ? '나에게 맞는 스킨제품 찾기 — 1분 피부 타입 테스트' : '1분만에 내 피부 타입이랑 꼭 필요한 제품 찾아준대. 로그인 없이 무료!',
          imageUrl: KAKAO_SHARE_IMG,
          link: { mobileWebUrl: url, webUrl: url }
        },
        buttons: [{ title: isBrag ? '내 결과 보기' : '테스트 하러 가기', link: { mobileWebUrl: url, webUrl: url } }]
      });
      closeShareSheet();
      return;
    } catch(e) { /* SDK 실패 시 아래 폴백 */ }
  }
  if (navigator.share) {
    navigator.share({ title:text, text:text, url:url }).catch(function(){});
  } else {
    /* PC 등 Web Share 미지원: 문구+링크 복사 → 실패 시 수동 복사 프롬프트 */
    var full = text + ' ' + url;
    _copyText(full, function(ok){
      if (ok) alert('공유 문구를 복사했어요. 카카오톡에 붙여넣어 보내주세요!');
      else window.prompt('아래 문구를 복사해서 공유해주세요 (Ctrl+C)', full);
    });
  }
  closeShareSheet();
}

/* 별점 */
var _rating = 0;
function bindStars() {
  Array.prototype.forEach.call(document.querySelectorAll('#stars .star'), function(st){
    st.addEventListener('click', function(){
      _rating = parseInt(st.getAttribute('data-v'), 10);
      Array.prototype.forEach.call(document.querySelectorAll('#stars .star'), function(s2){
        s2.classList.toggle('on', parseInt(s2.getAttribute('data-v'), 10) <= _rating);
      });
      document.getElementById('fb-submit').disabled = false;
    });
  });
}

function submitRating() {
  var btn = document.getElementById('fb-submit');
  var text = (document.getElementById('fb-text') || {}).value || '';
  btn.disabled = true;
  var finish = function(){
    var card = document.getElementById('rating-card');
    if (card) card.innerHTML = '<div class="rp-sechead">주인장에게 한마디</div><div class="fb-done">고마워요! 주인장이 잘 읽을게요 🐱</div>';
    trackEvent('kr_rating_submit', { rating: _rating });
    trackEvent('kr_feedback_submit', { rating: _rating }); /* ⚠️ 2026-07-29 KR_데이터수집_GA4.md 이름 정합 */
  };

  /* 최후 보루: 피드백을 별도 행으로 INSERT.
     (UPDATE 권한이 없어도 EN과 같은 insert 권한만 있으면 무조건 저장됨) */
  var insertFallback = function(){
    fetch(SB_URL + '/rest/v1/reports', {
      method:'POST', headers: sbHeaders(),
      body: JSON.stringify({
        archetype: (window._krProfile || {}).archetype || null,
        subtype_name: '피드백',
        profile_data: {
          kr: true, type: 'feedback', locale: 'ko',
          short_id: _shortId || null,
          rating: _rating, feedback_text: text,
          answers: (window._krProfile || {}).answers || null
        }
      })
    }).then(finish).catch(finish);
  };

  /* PATCH는 RLS에 UPDATE 정책이 없으면 0행 업데이트로 조용히 무시되므로,
     return=representation으로 실제 반영 행 수를 확인하고 실패 시 폴백 */
  var tryPatch = function(url, body){
    return fetch(url, {
      method: 'PATCH',
      headers: Object.assign({}, sbHeaders(), { 'Prefer': 'return=representation' }),
      body: JSON.stringify(body)
    }).then(function(res){
      if (!res.ok) return Promise.reject('patch-status');
      return res.json().then(function(rows){
        if (!rows || !rows.length) return Promise.reject('patch-norow');
        finish();
      });
    });
  };

  if (_shortId && _krSaveMode === 'columns') {
    tryPatch(SB_URL + '/rest/v1/reports?short_id=eq.' + _shortId,
      { rating: _rating, feedback_text: text }).catch(insertFallback);
  } else if (_shortId && _krSaveMode === 'legacy') {
    var pd = Object.assign({}, _krProfileData || {}, { rating: _rating, feedback_text: text });
    _krProfileData = pd;
    tryPatch(SB_URL + '/rest/v1/reports?profile_data->>short_id=eq.' + _shortId,
      { profile_data: pd }).catch(insertFallback);
  } else {
    insertFallback();
  }
}

/* ══════════════════════════════════════════════
   저장된 링크(?r=)로 다시 열기 + 재검사 델타
══════════════════════════════════════════════ */
function _normalizeReportRow(row) {
  var pd = row.profile_data || {};
  var isLegacy = !row.answers && !!pd.answers;
  return {
    id: row.id || null,
    mode: isLegacy ? 'legacy' : 'columns',
    archetype: row.archetype || pd.archetype || null,
    answers: row.answers || pd.answers || null,
    dash: (row.scores && row.scores.dash) || (pd.scores && pd.scores.dash) || null,
    profile_data: pd
  };
}
function _fetchReportByShortId(shortId, cb) {
  var enc = encodeURIComponent(shortId);
  var legacyQuery = function(){
    fetch(SB_URL + '/rest/v1/reports?profile_data->>short_id=eq.' + enc + '&select=*', { headers: sbHeaders() })
      .then(function(res){ return res.ok ? res.json() : Promise.reject(res.status); })
      .then(function(rows){ cb(rows && rows[0] ? _normalizeReportRow(rows[0]) : null); })
      .catch(function(){ cb(null); });
  };
  fetch(SB_URL + '/rest/v1/reports?short_id=eq.' + enc + '&select=*', { headers: sbHeaders() })
    .then(function(res){ return res.ok ? res.json() : Promise.reject(res.status); })
    .then(function(rows){
      if (rows && rows[0]) cb(_normalizeReportRow(rows[0]));
      else legacyQuery();
    })
    .catch(legacyQuery);
}

function loadSavedReport(shortId) {
  document.getElementById('survey-view').classList.add('hidden');
  _fetchReportByShortId(shortId, function(row){
    if (!row || !row.answers) { startFresh(); return; }
    _krSaveMode = row.mode;
    _krRowId = row.id;
    _krProfileData = row.mode === 'legacy' ? row.profile_data : null;
    var result = scoreAnswersKR(row.answers);
    var flags = computeFlags(row.answers, result.tags);
    var archetype = row.archetype || classifyArchetypeKR(result.scores, result.tags, flags);
    var dash = row.dash || computeDashKR(result.scores);
    window._krProfile = { archetype:archetype, scores:result.scores, tags:result.tags, flags:flags, dash:dash, answers:row.answers };
    _shortId = shortId;
    _surveyCompleted = true;
    renderReport(window._krProfile);
    trackEvent('kr_report_view', { archetype: archetype, short_id: _shortId });
    var input = document.getElementById('report-link');
    if (input) input.value = location.origin + location.pathname + '?r=' + shortId;
    /* 재검사 버튼: 이번 결과를 부모로 저장하고 새로 시작 */
    var linkCard = document.getElementById('link-card');
    if (linkCard) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'fb-submit'; btn.style.marginTop = '14px';
      btn.textContent = '↻ 다시 검사하기 (지난 결과와 비교해드려요)';
      btn.onclick = function(){
        try { sessionStorage.setItem('kr_parent_report', JSON.stringify({ short_id: shortId, dash: dash })); } catch(e) {}
        location.href = location.pathname;
      };
      linkCard.appendChild(btn);
    }
  });
}

function startFresh() {
  document.getElementById('report-wrap').classList.add('hidden');
  document.getElementById('survey-view').classList.remove('hidden');
  currentIdx = 0; answers = {}; _surveyCompleted = false;
  renderQ();
  /* ⚠️ 2026-07-29 KR_데이터수집_GA4.md — 이벤트명을 kr_survey_start로 통일. 기존 kr_test_start도
     당분간 같이 발화(과거 대시보드 호환) */
  trackEvent('kr_test_start', { from:'survey' });
  trackEvent('kr_survey_start', { from:'survey' });
}

/* ══════════════════════════════════════════════
   초기화
══════════════════════════════════════════════ */
(function init(){
  var m = location.search.match(/[?&]r=([a-z0-9]+)/i);
  var parent = null;
  try { parent = JSON.parse(sessionStorage.getItem('kr_parent_report') || 'null'); } catch(e) {}
  if (parent && parent.dash) window._parentDash = parent.dash;
  if (m) loadSavedReport(m[1]);
  else startFresh();

  /* ⚠️ 2026-07-29 KR_데이터수집_GA4.md — 설문 중 이탈 추적. 완료 전(= _surveyCompleted false)이고
     답변을 하나라도 했으면 마지막으로 보고 있던 문항을 last_question으로 전송 */
  window.addEventListener('beforeunload', function(){
    if (_surveyCompleted) return;
    if (!answers || !Object.keys(answers).length) return;
    var qs = visibleQuestions();
    var q = qs[currentIdx];
    trackEvent('kr_survey_abandon', { last_question: q ? q.id : 'unknown' });
  });
})();
</script>
