# Supabase Keepalive — 무료 플랜은 7일간 활동 없으면 프로젝트가 자동 정지됩니다.
# 이 파일을 레포의 .github/workflows/supabase-keepalive.yml 경로에 저장하세요.
name: Supabase Keepalive

on:
  schedule:
    - cron: '0 0 */3 * *'   # 3일마다 자동 실행 (UTC 기준 자정)
  workflow_dispatch:          # GitHub에서 수동으로도 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "https://ijuavefvnfghnyzmyubh.supabase.co/rest/v1/reports?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
